name: Refresh podcast corpus

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum episodes to download/transcribe/export in this run"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: refresh-podcast-corpus
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Refresh corpus
        env:
          PODCAST_RSS_URL: ${{ secrets.PODCAST_RSS_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_PATH: data/episodes.sqlite3
          REFERENCE_REFRESH_LIMIT: ${{ github.event.inputs.limit || '3' }}
        run: reference-refresh-corpus --limit "$REFERENCE_REFRESH_LIMIT"

      - name: Commit refreshed database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/episodes.sqlite3
          if git diff --cached --quiet; then
            echo "No corpus changes to commit."
            exit 0
          fi
          git commit -m "Refresh podcast corpus"
          git push
