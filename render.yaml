services:
  - type: web
    name: reference-podcast-discord-bot
    runtime: python
    plan: free
    buildCommand: python -m pip install --upgrade pip && python -m pip install .
    startCommand: python start.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_PATH
        value: data/episodes.sqlite3
      - key: DISCORD_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_ASK_MODEL
        value: gpt-4.1-mini
      - key: DISCORD_GUILD_IDS
        sync: false
